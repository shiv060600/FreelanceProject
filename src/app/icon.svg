<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded rectangle background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGradient)"/>
  
  <!-- First F (slightly behind) -->
  <text x="15" y="48" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)" opacity="0.7">F</text>
  
  <!-- Second F (layered on top) -->
  <text x="25" y="48" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)">F</text>
</svg>

